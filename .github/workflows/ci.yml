name: Verify academic submission
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: liam_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: liam_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U liam_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://liam_test:ephemeral-ci-only@127.0.0.1:5432/liam_test
      AI_TRACING_PROVIDER: 'off'
      LIVE_OPERATIONS: 'false'
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
